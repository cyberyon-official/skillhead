name: hooks
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: NTFS-safe paths
        shell: python
        run: |
          import re, subprocess, sys
          bad = [p for p in subprocess.run(["git", "ls-files"], capture_output=True, text=True).stdout.splitlines()
                 if re.search(r'[<>:"|?*\\]|[. ]$|(^|/)(CON|PRN|AUX|NUL|COM\d|LPT\d)(\.|/|$)', p, re.I)]
          print("\n".join(bad)); sys.exit(1 if bad else 0)
      - run: python ci/check.py
      - name: Launcher runs a hook (bin/skillhead)
        shell: bash
        run: echo '{}' | bash bin/skillhead spawn_guard
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code
      # Not --strict: the root CLAUDE.md is for contributors, not plugin context (a warning).
      - run: claude plugin validate .
